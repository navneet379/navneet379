name: Update contribution snake

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Generate dark contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#38BDF8

      - name: Publish generated SVG
        shell: bash
        run: |
          branch=contribution-snake
          output="github-snake-dark.svg"
          test -s "dist/$output"
          mv "dist/$output" "$RUNNER_TEMP/$output"

          if git ls-remote --exit-code --heads origin "refs/heads/$branch"; then
            git fetch --depth=1 origin "refs/heads/$branch"
            git switch --detach FETCH_HEAD
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
            git switch --orphan "$branch"
          fi

          cp "$RUNNER_TEMP/$output" "$output"
          git add -- "$output"
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Update contribution snake'
          git push origin "HEAD:refs/heads/$branch"
