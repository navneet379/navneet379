<svg xmlns="http://www.w3.org/2000/svg" width="960" height="270" viewBox="0 0 960 270" role="img" aria-labelledby="title description">
  <title id="title">Backend systems terminal</title>
  <desc id="description">A sky-blue signal passes through an API, a workflow, and a database above a Docker and AWS runtime.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#161B22"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#263342" stroke-opacity=".56"/>
    </pattern>
    <clipPath id="frame">
      <rect x="1" y="1" width="958" height="268" rx="20"/>
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="960" height="270" fill="#0D1117"/>
    <path d="M0 0h960v53H0z" fill="#161B22"/>
    <path d="M0 53h960M417 53v217" stroke="#303B48"/>
    <path d="M417 54h543v216H417z" fill="url(#surface)"/>
    <path d="M418 54h542v216H418z" fill="url(#grid)"/>
    <circle cx="35" cy="26" r="4" fill="#546378"/>
    <circle cx="50" cy="26" r="4" fill="#546378"/>
    <circle cx="65" cy="26" r="4" fill="#F59E0B"/>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace">
      <text x="88" y="32" font-size="15" fill="#ACB9C8">~/navneet379</text>
      <text x="928" y="32" text-anchor="end" font-size="14" fill="#ACB9C8">BACKEND SYSTEMS</text>
      <text x="35" y="106" font-size="18" fill="#38BDF8">❯</text>
      <text x="62" y="106" font-size="17" fill="#C1CEDD">inspect request path</text>
      <rect x="270" y="92" width="8" height="16" rx="1" fill="#38BDF8" opacity=".8">
        <animate attributeName="opacity" begin="0s" dur="1.4s" values=".8;.22;.8" repeatCount="3"/>
      </rect>
      <text x="35" y="219" font-size="15" fill="#ACB9C8">Python / PostgreSQL / Docker / AWS</text>
    </g>
    <text x="34" y="171" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="42" font-weight="650" fill="#F0F6FC">Navneet Saunee</text>
    <g stroke="#516378" fill="none">
      <path d="M585 135H634M751 135H797M543 167v40h322v-40M705 175v32" stroke-dasharray="4 4"/>
      <rect x="490" y="108" width="95" height="54" rx="7" fill="#101923" stroke="#38BDF8"/>
      <rect x="634" y="97" width="117" height="76" rx="7" fill="#141F2B"/>
      <ellipse cx="865" cy="112" rx="68" ry="16" fill="#192533"/>
      <path d="M797 112v37c0 9 31 16 68 16s68-7 68-16v-37" fill="#121D29"/>
      <path d="M797 112c0 9 31 16 68 16s68-7 68-16"/>
    </g>
    <circle cx="599" cy="135" r="4" fill="#38BDF8">
      <animate attributeName="cx" begin=".35s" dur="1.5s" values="593;628;628" repeatCount="3"/>
      <animate attributeName="opacity" begin=".35s" dur="1.5s" values="1;1;0" repeatCount="3"/>
    </circle>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="14" text-anchor="middle" fill="#E2EAF4">
      <text x="537" y="140">API</text>
      <text x="692" y="140">WORKFLOW</text>
      <text x="865" y="151">DATABASE</text>
      <text x="705" y="230" fill="#F59E0B">CONTAINER RUNTIME</text>
    </g>
  </g>
  <rect x="1" y="1" width="958" height="268" rx="20" fill="none" stroke="#364557"/>
</svg>
